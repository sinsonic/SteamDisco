# Steam PICS change history is short (often < 4–6 hours under load).
# Running hourly keeps the change number fresh so we don't re-baseline and miss apps.
# GitHub cron is UTC-only and may delay 15–60+ minutes.
name: Daily Steam discovery

on:
  schedule:
    - cron: "0 * * * *" # every hour, on the hour (UTC)
  workflow_dispatch: # allow manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & run
        id: discover
        continue-on-error: true
        run: |
          mkdir -p data
          dotnet restore
          dotnet run --configuration Release --no-launch-profile -- data/gamelist.json data/new_today.json

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gamelist.json data/new_today.json data/new_*.json
          if git diff --staged --quiet; then
            echo "No file changes to commit."
          else
            git commit -m "chore: daily Steam discovery $(date -u +%Y-%m-%d)"
            git push
          fi
          if [ "${{ steps.discover.outcome }}" != "success" ]; then
            echo "Discover step outcome: ${{ steps.discover.outcome }}"
            exit 1
          fi
